name: 毎日のコナンネタ検索

on:
  schedule:
    # 毎日 22:00 UTC = 日本時間 朝7:00
    - cron: "0 22 * * *"
  workflow_dispatch: {}  # 手動実行ボタンも使えるようにする

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 検索スクリプト実行
        run: python3 tools/daily_search.py

      - name: 変更をコミット
        run: |
          git config user.name "conan-agent-bot"
          git config user.email "actions@github.com"
          git add topics/
          git diff --cached --quiet || git commit -m "ネタ自動更新: $(date +'%Y-%m-%d')"
          git push
